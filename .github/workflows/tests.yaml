name: Tests

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        env:
            MISE_ENABLE_TOOLS: bun

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup tools from mise.toml
              uses: jdx/mise-action@v5

            - name: Install dependencies
              run: bun ci

            - name: Run tests
              run: bun run test

            - name: Test installed Astro package
              run: bun run test:astro-install
