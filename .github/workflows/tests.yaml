name: Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        name: test
        runs-on: ubuntu-latest
        env:
            MISE_ENABLE_TOOLS: bun

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup tools from mise.toml
              uses: jdx/mise-action@v5

            - name: Install dependencies
              run: bun ci

            - name: Verify
              run: mise run verify

            - name: Generate coverage report
              run: bun test --coverage --coverage-reporter=lcov test/unit test/integration

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
